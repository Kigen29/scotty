version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Nairobi
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    labels: ["dependencies", "no-changeset"]
    groups:
      # One PR for the ~30 Radix packages instead of thirty.
      radix:
        patterns: ["@radix-ui/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"
      supabase:
        patterns: ["@supabase/*"]
    ignore:
      # Major bumps land deliberately, not on a Monday morning — a Vite or
      # React major needs the app exercised by hand before merging.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "no-changeset"]
    groups:
      # One PR for all action updates rather than one per action. The first
      # run opened five separate PRs for five action majors, each of which
      # would have had to be reviewed and merged on its own.
      github-actions:
        patterns: ["*"]
