version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Nairobi
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    labels: ["dependencies", "no-changeset"]
    groups:
      # One PR for the ~30 Radix packages instead of thirty.
      radix:
        patterns: ["@radix-ui/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"
      supabase:
        patterns: ["@supabase/*"]
    ignore:
      # Every npm major lands deliberately, on its own branch, with the app
      # exercised by hand. Dependabot handles patches and minors.
      #
      # The narrower rule this replaces only covered vite, react, react-dom and
      # tailwindcss, so the first run proposed a single PR bumping typescript
      # 5 -> 7, eslint 9 -> 10, vitest 3 -> 5, eslint-plugin-react-hooks 5 -> 7
      # and @vitejs/plugin-react-swc 3 -> 4 together. It failed Build, Lint,
      # Test and Typecheck, and five simultaneous tool majors is not something
      # anyone can review as one change.
      #
      # To take a major: `npm i <pkg>@latest` on a branch named for it, run
      # `npm run verify`, exercise the app, and open a PR on its own.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "no-changeset"]
    groups:
      # One PR for all action updates rather than one per action. The first
      # run opened five separate PRs for five action majors, each of which
      # would have had to be reviewed and merged on its own.
      github-actions:
        patterns: ["*"]
