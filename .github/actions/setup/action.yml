name: Setup
description: Check out deps-ready Node environment for Scotty (Node + npm cache + npm ci)

inputs:
  node-version:
    description: Node version to install
    required: false
    # 24 to match .nvmrc and the version this is developed on.
    #
    # Not 20: @changesets/cli's bin.js calls module.enableCompileCache(), which
    # landed in Node 22.1, so the release workflow died with
    # "TypeError: enableCompileCache is not a function" on Node 20 while every
    # other job passed. Keeping CI on the same major as local development also
    # avoids that whole class of works-here-fails-there bug.
    default: "24"

runs:
  using: composite
  steps:
    - name: Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # `npm ci` is fast here because setup-node caches the npm download cache
    # keyed on package-lock.json. Caching node_modules itself is skipped
    # deliberately — it breaks whenever a native dep or Node version changes.
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
